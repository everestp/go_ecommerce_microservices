services:
  redis:
    image: redis:8.2.0-alpine
    container_name: simple_auth_redis
    ports:
      - "6379:6379"
    restart: always

  postgresql:
    image: postgres:17-alpine
    container_name: simple_auth_postgresql
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simple_auth_db
    volumes:
      - pgdata:/var/lib/postgresql/data




volumes:
  pgdata: